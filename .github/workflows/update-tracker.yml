name: Update live tracker

# Re-runs the strategy code on fresh prices every weekday after the US market close
# and commits the new data/tracker.json. The Live Tracker page reads that file.
on:
  schedule:
    - cron: "43 21 * * 1-5"   # 21:43 UTC = 4:43 pm New York (winter) / 5:43 pm (summer)
    - cron: "17 0 * * 2-6"    # backup at 00:17 UTC (7:17 pm NY winter), in case GitHub skips the first run
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_tracker.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/tracker.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          git commit -m "Update live tracker data"
          git push
